---
# Strategic merge patch — replace the 'connection' value with your own.
#
# The value must be the base64-encoded Elasticsearch connection URL.
# Supported formats:
#   Without auth:  http://elasticsearch-host:9200
#   With auth:     http://username:password@elasticsearch-host:9200
#   With TLS:      https://username:password@elasticsearch-host:9200
#
# Generate the base64 value:
#   echo -n "http://elasticsearch-host:9200" | base64
#
# Example (http://elasticsearch:9200 → aHR0cDovL2VsYXN0aWNzZWFyY2g6OTIwMA==):
apiVersion: v1
kind: Secret
metadata:
  name: airflow-elasticsearch
type: Opaque
data:
  connection: aHR0cDovL2VsYXN0aWNzZWFyY2g6OTIwMA==
