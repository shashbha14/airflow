---
# Example overlay for Elasticsearch connection secret.
#
# Customize secret-patch.yaml with your actual connection details, then apply:
#   kubectl kustomize chart/kustomize/overlays/elasticsearch | kubectl apply -f -
#
# Then reference the secret in your Helm values:
#   elasticsearch:
#     enabled: true
#     secretName: airflow-elasticsearch
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../bases/elasticsearch

patches:
  - path: secret-patch.yaml
    target:
      kind: Secret
      name: airflow-elasticsearch
