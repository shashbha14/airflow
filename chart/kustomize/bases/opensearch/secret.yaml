---
# OpenSearch connection secret for Apache Airflow.
#
# The 'connection' key must hold a base64-encoded URL of the form:
#   http[s]://[user:password@]host:port
#
# To generate the value:
#   echo -n "http://opensearch:9200" | base64
#   echo -n "http://user:password@opensearch:9200" | base64
#
# In your Helm values, set:
#   opensearch:
#     enabled: true
#     secretName: <name-of-this-secret>
#
# The secret name below matches the default Helm release name "airflow".
# If your release name differs, rename this resource in your overlay using
# kustomization.yaml's 'namePrefix' or by overriding 'metadata.name'.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-opensearch
  labels:
    tier: airflow
type: Opaque
data:
  # Placeholder — override this value in your overlay
  connection: ""
